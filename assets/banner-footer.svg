<svg width="1200" height="90" viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050308"/>
      <stop offset="50%" stop-color="#160a26"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>
    <pattern id="dots2" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <circle cx="3" cy="3" r="1.4" fill="#00f0ff" opacity="0.3"/>
    </pattern>
    <linearGradient id="streak2" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#ff2fb3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff2fb3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .slab { animation: swim2 20s linear infinite; }
      @keyframes swim2 { 0% { transform: translate(0,0);} 100% { transform: translate(-56px,56px);} }
      .beam { animation: cross 7s linear infinite; }
      @keyframes cross {
        0%   { transform: translateX(-200px); opacity: 0; }
        20%  { opacity: 0.9; }
        80%  { opacity: 0.9; }
        100% { transform: translateX(1400px); opacity: 0; }
      }
    </style>
  </defs>
  <rect width="1200" height="90" fill="url(#bg2)"/>
  <g class="slab"><rect x="-60" y="-60" width="1320" height="210" fill="url(#dots2)"/></g>
  <rect class="beam" x="0" y="40" width="260" height="2" fill="url(#streak2)"/>
</svg>
